<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pixel Vignette Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: Arial, sans-serif; margin: 16px; background: #eee; color: #000; }
  #wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  #panel { background: #fff; border: 1px solid #999; padding: 12px; width: 280px; }
  #panel label { display: block; margin-top: 10px; font-size: 14px; }
  #panel input[type=range] { width: 100%; }
  #panel input[type=number], #panel select { width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { margin-top: 10px; padding: 5px 10px; }
  #view { background: #ccc; border: 1px solid #999; padding: 8px; }
  canvas { max-width: 100%; image-rendering: pixelated; display: block; background:
    repeating-conic-gradient(#fff 0% 25%, #ddd 0% 50%) 0 0 / 16px 16px; }
</style>
</head>
<body>
<h2>Pixel Vignette Tool</h2>
<div id="wrap">
  <div id="panel">
    <div class="row">
      <div><label>Width <input type="number" id="w" value="480" min="8"></label></div>
      <div><label>Height <input type="number" id="h" value="270" min="8"></label></div>
    </div>

    <label>Pixel size: <span id="pxV"></span>
      <input type="range" id="px" min="1" max="32" value="6"></label>

    <label>Depth (how far it reaches inward): <span id="depV"></span>%
      <input type="range" id="dep" min="1" max="100" value="40"></label>

    <label>Strength (darkest point): <span id="strV"></span>%
      <input type="range" id="str" min="0" max="100" value="80"></label>

    <label>Style
      <select id="style">
        <option value="bands">Stepped bands</option>
        <option value="dither">Dither (patterned)</option>
        <option value="soft">Soft (pixelated gradient)</option>
      </select></label>

    <label>Band count (stepped style): <span id="bndV"></span>
      <input type="range" id="bnd" min="2" max="16" value="5"></label>

    <label>Shape
      <select id="shape">
        <option value="rect">Rectangle (from edges)</option>
        <option value="oval">Oval (from corners)</option>
      </select></label>

    <label>Color <input type="color" id="col" value="#000000"></label>

    <label>Preview image <input type="file" id="img" accept="image/*"></label>
    <button id="fit">Match size to image</button>
    <label><input type="checkbox" id="only"> Export vignette only (transparent PNG)</label>
    <button id="save">Download PNG</button>
  </div>
  <div id="view"><canvas id="c"></canvas></div>
</div>

<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');
let img = null;
const bayer = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function vignetteCanvas() {
  const W = Math.max(8, +$('w').value|0), H = Math.max(8, +$('h').value|0);
  const px = +$('px').value, depth = +$('dep').value/100, str = +$('str').value/100;
  const style = $('style').value, bands = +$('bnd').value, shape = $('shape').value;
  const hex = $('col').value;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const cw = Math.ceil(W/px), ch = Math.ceil(H/px);
  const small = document.createElement('canvas'); small.width = cw; small.height = ch;
  const sctx = small.getContext('2d'), data = sctx.createImageData(cw, ch);
  const depthPx = depth * Math.min(W,H) / 2;
  for (let j=0;j<ch;j++) for (let i=0;i<cw;i++) {
    const x = (i+.5)*px, y = (j+.5)*px;
    let t;
    if (shape === 'rect') {
      const e = Math.min(x, W-x, y, H-y);
      t = 1 - e/depthPx;
    } else {
      const nx = (x-W/2)/(W/2), ny = (y-H/2)/(H/2);
      t = (Math.sqrt(nx*nx+ny*ny) - (1-depth)) / depth;
    }
    t = Math.min(1, Math.max(0, t));
    let a;
    if (style === 'bands') a = Math.ceil(t*bands)/bands * str;
    else if (style === 'dither') a = (t*str*16 > bayer[j&3][i&3] + 0.5) ? 1 : 0;
    else a = t*str;
    const k = (j*cw+i)*4;
    data.data[k]=r; data.data[k+1]=g; data.data[k+2]=b; data.data[k+3]=Math.round(a*255);
  }
  sctx.putImageData(data,0,0);
  return {small, W, H, cw, ch, px};
}

function draw(forExport) {
  const v = vignetteCanvas();
  c.width = v.W; c.height = v.H;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,v.W,v.H);
  if (img && !(forExport && $('only').checked)) {
    const s = Math.max(v.W/img.width, v.H/img.height);
    const dw = img.width*s, dh = img.height*s;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, (v.W-dw)/2, (v.H-dh)/2, dw, dh);
  }
  ctx.drawImage(v.small, 0, 0, v.cw*v.px, v.ch*v.px);
}

function update() {
  $('pxV').textContent = $('px').value;
  $('depV').textContent = $('dep').value;
  $('strV').textContent = $('str').value;
  $('bndV').textContent = $('bnd').value;
  draw(false);
}

document.querySelectorAll('#panel input, #panel select').forEach(e => e.addEventListener('input', update));
$('img').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; update(); };
  im.src = URL.createObjectURL(f);
});
$('fit').onclick = () => { if (img) { $('w').value = img.width; $('h').value = img.height; update(); } };
$('save').onclick = () => {
  draw(true);
  const a = document.createElement('a');
  a.download = 'vignette.png'; a.href = c.toDataURL('image/png'); a.click();
  draw(false);
};
update();
</script>
</body>
</html>
